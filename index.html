<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MACS Spiele</title>
  <style>
    :root { --bg:#f6f4ef; --text:#1f2328; --accent:#2f7d5b; --card:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#16181c; --text:#e8e6e1; --accent:#5fc193; --card:#22252b; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
           background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,sans-serif; }
    main { max-width:520px; width:100%; background:var(--card); border-radius:16px; padding:32px;
           box-shadow:0 4px 24px rgba(0,0,0,.08); text-align:center; }
    h1 { margin:0 0 8px; font-size:1.8rem; }
    p { line-height:1.5; }
    button { font-size:1rem; padding:12px 20px; border:0; border-radius:10px; background:var(--accent);
             color:#fff; cursor:pointer; }
    #zaehler { font-size:2.5rem; font-weight:700; margin:16px 0; }
    small { opacity:.7; }
    h2 { margin:28px 0 8px; font-size:1.2rem; }
    a.spiel { display:inline-block; margin-top:4px; padding:12px 20px; border-radius:10px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; }
  </style>
</head>
<body>
  <main>
    <h1>🎉 Es läuft!</h1>
    <p>Willkommen bei <strong>MACS Spiele</strong>. Diese Seite liegt auf GitHub Pages und ist live im Internet.</p>
    <p>Kleiner Test, ob JavaScript funktioniert:</p>
    <div id="zaehler">0</div>
    <button id="knopf">Klick mich</button>
    <h2>Spiele</h2>
    <p><a class="spiel" href="spiele/reaktionstest/">⚡ Reaktionstest</a><br><small>Wie schnell reagierst du, wenn es grün wird?</small></p>
  </main>
  <script>
    let klicks = 0;
    document.getElementById('knopf').addEventListener('click', () => {
      klicks++;
      document.getElementById('zaehler').textContent = klicks;
    });
  </script>
</body>
</html>
